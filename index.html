<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQLMANTRA — SQL 真言箓</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 数据文件缺失错误横幅（常驻可关闭，默认隐藏） -->
  <div id="error-banner" hidden>
    <span class="banner-text"></span>
    <button class="banner-close" type="button" aria-label="关闭">✕</button>
  </div>

  <!-- 顶栏：52px 固定 -->
  <header class="topbar">
    <button id="nav-toggle" type="button" aria-label="打开导航">☰</button>
    <div class="brand">
      <span class="brand-title">SQL真言箓</span>
      <span class="brand-sub">SQLMANTRA · OFFLINE CHEATSHEET</span>
    </div>
    <div class="search-wrap">
      <input id="search" type="text" maxlength="100"
             placeholder="搜索语法 / 函数 / 场景，如：去重留一"
             autocomplete="off" spellcheck="false" aria-label="搜索">
    </div>
    <div class="top-right">
      <button id="search-icon" type="button" aria-label="展开搜索">🔍</button>
      <span id="hit-counter">命中 0 / 共 0 条</span>
      <button id="theme-toggle" type="button" aria-label="切换主题">☾</button>
    </div>
  </header>

  <!-- 主布局：左导航 216px + 内容区独立滚动 -->
  <div class="layout">
    <nav id="sidenav" class="sidenav" aria-label="分类导航"></nav>
    <div id="nav-overlay"></div>
    <main id="content" class="content">
      <div id="content-inner" class="content-inner"></div>
    </main>
  </div>

  <!-- 数据与应用脚本：普通 script 标签按 catalog 声明顺序加载，禁止 module/fetch -->
  <script src="js/highlight.js"></script>
  <script src="js/data/catalog.js"></script>
  <script src="js/data/core.js"></script>
  <script src="js/data/join.js"></script>
  <script src="js/data/window.js"></script>
  <script src="js/data/string-date.js"></script>
  <script src="js/data/performance.js"></script>
  <script src="js/data/patterns.js"></script>
  <script src="js/data/dialects.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
